version: '3.8'

services:
  db:
    image: postgis/postgis:14-3.3
    environment:
      POSTGRES_DB: ${DB_NAME:-gnaf_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
    volumes:
      - db_data:/var/lib/postgresql/data
    restart: unless-stopped
    expose:
      - "5432"

  web:
    build:
      context: ..
      dockerfile: deployment/Dockerfile.txt
    env_file:
      - ../.env
    environment:
      DB_HOST: db
    expose:
      - "5000"
    depends_on:
      - db
    restart: unless-stopped
    entrypoint: ["/app/webapp/entrypoint.sh"]

  fastapi:
    build:
      context: ..
      dockerfile: deployment/Dockerfile.txt
    env_file:
      - ../.env
    environment:
      DB_HOST: db
    expose:
      - "8000"
    depends_on:
      - db
    restart: unless-stopped
    entrypoint: ["/app/webapp/entrypoint.sh"]
    command: ["uvicorn", "fastapi_app:app", "--host", "0.0.0.0", "--port", "8000"]

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web
      - fastapi
    restart: unless-stopped

volumes:
  db_data: {}
