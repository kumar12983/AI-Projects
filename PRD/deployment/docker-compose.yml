version: '3.8'

services:
  db:
    image: postgis/postgis:14-3.3
    environment:
      POSTGRES_DB: ${DB_NAME:-gnaf_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
    volumes:
      - db_data:/var/lib/postgresql/data
    restart: unless-stopped
    # Not exposed to host in production; web container connects via internal network
    expose:
      - "5432"

  web:
    build:
      context: ..
      dockerfile: deployment/Dockerfile.txt
    env_file:
      - ../.env
    environment:
      DB_HOST: db
    ports:
      - "80:5000"
    depends_on:
      - db
    restart: unless-stopped
    entrypoint: ["/app/webapp/entrypoint.sh"]

volumes:
  db_data: {}
